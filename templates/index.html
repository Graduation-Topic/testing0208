<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駕駛疲勞偵測系統</title>
    <!-- 引入 Chart.js 用於繪製即時圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            font-family: 'Microsoft JhengHei', sans-serif;
        }
        .video-container {
            margin-top: 20px;
            border: 5px solid #34495e;
            border-radius: 10px;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Microsoft JhengHei', sans-serif;
        }
        button:hover {
            background-color: #2980b9;
        }
        .chart-container {
            width: 800px;
            margin: 20px auto;
            background-color: #34495e;
            border-radius: 10px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1>🚗 駕駛疲勞偵測系統即時影像 (Web Stream)</h1>
    <img class="video-container" src="{{ url_for('video_feed') }}" width="800" height="600" alt="Camera Stream">
    
    <div class="controls">
        <button onclick="triggerAction('/force_recalibrate')">🎯 強制重新校正</button>
        <button onclick="triggerAction('/toggle_landmarks')">👁️ 切換特徵點顯示</button>
        <button onclick="triggerAction('/generate_report')">📊 生成分析報告</button>
    </div>

    <!-- 用來顯示提示訊息的區塊 -->
    <div id="message-box" style="margin-top: 15px; font-size: 18px; color: #f1c40f; height: 25px;"></div>
    
    <!-- 實時狀態圖表區塊 (Chart.js) -->
    <div class="chart-container">
        <canvas id="realtimeChart" height="100"></canvas>
    </div>

    <!-- 用來顯示圖表的區塊 -->
    <div style="margin-top: 20px;">
        <img id="report-view" style="display: none; max-width: 800px; border: 3px solid #34495e; border-radius: 10px;" alt="分析報告圖表">
    </div>

    <script>
        function triggerAction(endpoint) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = "處理中..."; // 按下按鈕時先顯示處理中

            fetch(endpoint, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    // 不使用 alert，改用文字顯示，這樣畫面就不會被凍結卡住
                    msgBox.innerText = data.message;
                    
                    // 如果是生成報表，則更新圖片並顯示
                    if(endpoint === '/generate_report') {
                        const reportImg = document.getElementById('report-view');
                        reportImg.src = "/report_image?t=" + new Date().getTime(); // 加上時間戳，避免瀏覽器快取舊圖片
                        reportImg.style.display = "inline-block";
                    }
                    
                    // 3 秒後自動清空訊息
                    setTimeout(() => { if(msgBox.innerText === data.message) msgBox.innerText = ""; }, 3000);
                })
                .catch(error => console.error('Error:', error));
        }

        // --- 實時圖表 (Chart.js) 設定 ---
        const ctx = document.getElementById('realtimeChart').getContext('2d');
        const realtimeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '精神分數', borderColor: '#2ecc71', data: [], fill: false, tension: 0.2, pointRadius: 0 },
                    { label: '閉眼率(%)', borderColor: '#e74c3c', data: [], fill: false, tension: 0.2, pointRadius: 0 },
                    { label: '低頭比例', borderColor: '#9b59b6', data: [], fill: false, tension: 0.2, pointRadius: 0, yAxisID: 'y1' },
                    { label: '嘴巴張開', borderColor: '#f1c40f', data: [], fill: false, tension: 0.2, pointRadius: 0, yAxisID: 'y1' }
                ]
            },
            options: {
                responsive: true,
                animation: false, // 關閉動畫讓即時更新更順暢
                scales: {
                    x: { ticks: { color: '#bdc3c7' }, grid: { color: '#2c3e50' } },
                    y: { min: 0, max: 100, position: 'left', ticks: { color: '#bdc3c7' }, grid: { color: '#2c3e50' } },
                    y1: { min: 0, max: 1, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#bdc3c7' } }
                },
                plugins: { legend: { labels: { color: 'white' } } }
            }
        });

        // 每 0.5 秒向後端請求一次最新數據並重繪圖表
        setInterval(() => {
            fetch('/realtime_data')
                .then(res => res.json())
                .then(data => {
                    if(data.timestamps && data.timestamps.length > 0) {
                        realtimeChart.data.labels = data.timestamps.map(t => t.toFixed(1) + 's');
                        realtimeChart.data.datasets[0].data = data.alertness;
                        realtimeChart.data.datasets[1].data = data.perclos;
                        realtimeChart.data.datasets[2].data = data.nod;
                        realtimeChart.data.datasets[3].data = data.jaw;
                        realtimeChart.update();
                    }
                })
                .catch(err => console.error("無法更新實時圖表:", err));
        }, 500);
    </script>
</body>
</html>
