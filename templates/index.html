<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駕駛疲勞偵測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 55%;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .status-bar {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .status-item {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .warnings {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .warning-msg {
            background: #ff4d4f;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        canvas {
            max-height: 250px;
            width: 100%;
        }
    </style>
</head>
<div id="notification-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>

<body>
    <div class="header">
        <h2>🚗 駕駛疲勞偵測系統儀表板</h2>
    </div>
    
    <div class="container">
        <!-- 左邊：攝影機畫面與控制區 -->
        <div class="left-panel">
            <div class="video-container">
                <img src="/video_feed" alt="Video Feed">
            </div>
            
            <div class="warnings" id="warnings-container"></div>
            
            <div class="status-bar">
                <div class="status-item">FPS: <span id="fps">0</span></div>
                <div class="status-item">環境亮度: <span id="brightness">0</span></div>
                <div class="status-item" id="night-mode" style="display:none; background: #ffe58f; color: #d48806;">夜間模式啟動中</div>
                <div class="status-item">一分鐘內哈欠: <span id="yawns">0</span> 次</div>
            </div>

            <div class="controls">
                <button onclick="handleButtonClick('/force_recalibrate')">強制重新校正</button>
                <button onclick="handleButtonClick('/toggle_landmarks')">切換特徵點顯示</button>
                <button onclick="handleButtonClick('/generate_report')">生成數據報表</button>
            </div>
        </div>

        <!-- 右邊：圖表與即時數據 -->
        <div class="right-panel">
            <div class="status-bar">
                <div class="status-item">精神分數: <span id="alertness">100</span>/100</div>
                <div class="status-item">PERCLOS: <span id="perclos">0</span>%</div>
                <div class="status-item">低頭比例: <span id="nod-ratio">0.5</span></div>
                <div class="status-item">轉頭比例: <span id="turn-ratio">0.5</span></div>
            </div>

            <canvas id="alertnessChart"></canvas>
            <canvas id="perclosChart"></canvas>
            <canvas id="nodChart"></canvas>
        </div>
    </div>

    <script>
        function showNotification(message, isSuccess = true) {
            const container = document.getElementById('notification-container');
            const notif = document.createElement('div');
            notif.textContent = message;
            notif.style.padding = '10px 20px';
            notif.style.backgroundColor = isSuccess ? '#28a745' : '#dc3545';
            notif.style.color = 'white';
            notif.style.borderRadius = '5px';
            notif.style.boxShadow = '0 2px 5px rgba(0,0,0,0.2)';
            notif.style.opacity = '0';
            notif.style.transition = 'opacity 0.3s ease-in-out';
            container.appendChild(notif);
            
            setTimeout(() => notif.style.opacity = '1', 10); // Fade in

            // Fade out and remove after 3 seconds
            setTimeout(() => {
                notif.style.opacity = '0';
                setTimeout(() => container.removeChild(notif), 300);
            }, 3000);
        }

        function handleButtonClick(endpoint) {
            fetch(endpoint, { method: 'POST' })
                .then(r => r.json())
                .then(d => showNotification(d.message, d.status === 'success'));
        }

        const commonOpts = { responsive: true, scales: { x: { display: false }, y: { beginAtZero: true } } };
        const createChart = (id, label, color, max) => new Chart(document.getElementById(id).getContext('2d'), {
            type: 'line', data: { labels: [], datasets: [{ label, data: [], borderColor: color, tension: 0.1 }] },
            options: { ...commonOpts, scales: { y: { min: 0, max } } }
        });

        const alertnessChart = createChart('alertnessChart', '精神分數 (Alertness)', '#28a745', 100);
        const perclosChart = createChart('perclosChart', '閉眼率 PERCLOS (%)', '#007bff', 100);
        const nodChart = createChart('nodChart', '低頭比例 (Nod Ratio)', '#6f42c1', 1);

        setInterval(async () => {
            const res = await fetch('/realtime_data');
            const data = await res.json();

            document.getElementById('fps').innerText = data.fps;
            document.getElementById('brightness').innerText = data.brightness.toFixed(1);
            document.getElementById('yawns').innerText = data.yawns;
            document.getElementById('alertness').innerText = data.current_alertness;
            document.getElementById('night-mode').style.display = data.night_mode ? 'block' : 'none';
            document.getElementById('perclos').innerText = data.perclos_calibrating ? `校正中(${data.perclos_history_len}/${data.perclos_window})` : (data.current_perclos * 100).toFixed(1);
            document.getElementById('nod-ratio').innerText = `${data.current_nod.toFixed(3)} (門檻: ${data.nod_thr.toFixed(3)})`;
            document.getElementById('turn-ratio').innerText = `${data.current_turn.toFixed(3)} (中心: ${data.turn_center.toFixed(3)})`;
            
            document.getElementById('warnings-container').innerHTML = (data.warnings || []).map(msg => `<div class="warning-msg">${msg}</div>`).join('');

            const labels = data.timestamps.map(t => t.toFixed(1));
            alertnessChart.data.labels = perclosChart.data.labels = labels;
            alertnessChart.data.datasets[0].data = data.alertness;
            perclosChart.data.datasets[0].data = data.perclos;
            nodChart.data.datasets[0].data = data.nod;
            
            [alertnessChart, perclosChart, nodChart].forEach(c => c.update());
        }, 500);
    </script>
</body>
</html>
