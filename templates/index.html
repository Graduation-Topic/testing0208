<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駕駛疲勞偵測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 55%;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            height: 70vh; /* 將固定畫布的高度限制設在「容器」上 */
            display: block; /* 移除 flex，避免瀏覽器對串流影像重新計算大小 */
        }
        .video-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .status-bar {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .status-item {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .warnings {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .warning-msg {
            background: #ff4d4f;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        canvas {
            max-height: 250px;
            width: 100%;
        }
        
        /* 響應式設計 (手機畫面自適應) */
        @media (max-width: 900px) {
            body { height: auto; min-height: 100vh; }
            .container { flex-direction: column; }
            .video-container { height: 50vh; } /* 手機版修改的是容器高度 */
            .left-panel { max-width: 100%; }
            .right-panel { 
                overflow-y: visible; 
            }
        }
    </style>
</head>
<div id="notification-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>

<body>
    <div class="header">
        <h2>🚗 駕駛疲勞偵測系統儀表板</h2>
    </div>
    
    <div class="container">
        <!-- 左邊：攝影機畫面與控制區 -->
        <div class="left-panel">
            <div class="video-container" style="position: relative;">
                <!-- 本機鏡頭畫面 -->
                <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: contain;"></video>
                <!-- 用來繪製綠色特徵點的透明畫布 -->
                <canvas id="output_canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none;"></canvas>
            </div>
            
            <div class="warnings" id="warnings-container"></div>
            
            <div class="status-bar">
                <div class="status-item">FPS: <span id="fps">0</span></div>
                <div class="status-item">環境亮度: <span id="brightness">0</span></div>
                <div class="status-item" id="night-mode" style="display:none; background: #ffe58f; color: #d48806;">夜間模式啟動中</div>
                <div class="status-item">一分鐘內哈欠: <span id="yawns">0</span> 次</div>
            </div>

            <div class="controls">
                <button onclick="handleButtonClick('/force_recalibrate')">強制重新校正</button>
                <button onclick="handleButtonClick('/toggle_landmarks')">切換特徵點顯示</button>
                <button onclick="handleButtonClick('/generate_report')">生成數據報表</button>
                <button onclick="handleButtonClick('/toggle_aspect_ratio')">切換畫面比例</button>
            </div>
        </div>

        <!-- 右邊：圖表與即時數據 -->
        <div class="right-panel">
            <div class="status-bar">
                <div class="status-item">精神分數: <span id="alertness">100</span>/100</div>
                <div class="status-item">PERCLOS: <span id="perclos">0</span>%</div>
                <div class="status-item">低頭比例: <span id="nod-ratio">0.5</span></div>
                <div class="status-item">轉頭比例: <span id="turn-ratio">0.5</span></div>
            </div>

            <canvas id="alertnessChart"></canvas>
            <canvas id="perclosChart"></canvas>
            <canvas id="nodChart"></canvas>
        </div>
    </div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        let faceLandmarker;
        let lastVideoTime = -1;

        // 步驟 1：載入 MediaPipe 邊緣運算模型 (WebAssembly)
        async function initializeFaceLandmarker() {
            const filesetResolver = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU" // 直接調用手機/筆電的顯示卡硬體加速
                },
                outputFaceBlendshapes: true,
                runningMode: "VIDEO",
                numFaces: 1
            });
            console.log("✅ 邊緣運算模型載入完成");
            startCamera();
        }

        // 步驟 2：直接啟動使用者的設備鏡頭
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
                .then((stream) => {
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                })
                .catch((err) => console.error("❌ 鏡頭開啟失敗:", err));
        }

        // 步驟 3：建立零延遲的偵測迴圈 (取代原 Python 的 while True)
        async function predictWebcam() {
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
            
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                
                // 執行臉部推論
                const results = faceLandmarker.detectForVideo(video, startTimeMs);
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                
                if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                    const blendshapes = results.faceBlendshapes[0].categories;
                    
                    // 這裡完美對應你原本 Python 的 eyeBlinkLeft, eyeBlinkRight, JawOpen 取值邏輯
                    const eyeBlinkLeft = blendshapes.find(s => s.categoryName === "eyeBlinkLeft").score;
                    const eyeBlinkRight = blendshapes.find(s => s.categoryName === "eyeBlinkRight").score;
                    const jawOpen = blendshapes.find(s => s.categoryName === "jawOpen").score;

                    // 測試：將分數即時印在網頁畫面上
                    document.getElementById('perclos').innerText = (Math.max(eyeBlinkLeft, eyeBlinkRight) * 100).toFixed(0);
                    
                    // [接下來將在此處移植 DriverFatigueDetector 的滑動視窗與打分邏輯]
                }
            }
            // 利用瀏覽器渲染機制形成無限迴圈
            window.requestAnimationFrame(predictWebcam);
        }

        // 啟動系統
        initializeFaceLandmarker();
    </script>   
</body>
</html>
