<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駕駛疲勞偵測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 55%;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            height: 70vh; /* 將固定畫布的高度限制設在「容器」上 */
            display: block; /* 移除 flex，避免瀏覽器對串流影像重新計算大小 */
        }
        .video-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .status-bar {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .status-item {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .warnings {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .warning-msg {
            background: #ff4d4f;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        .right-panel canvas {
            max-height: 250px;
            width: 100%;
        }
        
        /* 響應式設計 (手機畫面自適應) */
        @media (max-width: 900px) {
            body { height: auto; min-height: 100vh; }
            .container { flex-direction: column; }
            .video-container { height: 50vh; } /* 手機版修改的是容器高度 */
            .left-panel { max-width: 100%; }
            .right-panel { 
                overflow-y: visible; 
            }
        }
    </style>
</head>
<div id="notification-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>

<body>
    <div class="header">
        <h2>🚗 駕駛疲勞偵測系統儀表板</h2>
    </div>
    
    <div class="container">
        <!-- 左邊：攝影機畫面與控制區 -->
        <div class="left-panel">
            <div class="video-container" style="position: relative;">
                <!-- 本機鏡頭畫面 -->
                <video id="webcam" autoplay playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1);"></video>
                <!-- 用來繪製綠色特徵點的透明畫布 -->
                <canvas id="output_canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); pointer-events: none;"></canvas>
            </div>
            
            <div class="warnings" id="warnings-container"></div>
            
            <div class="status-bar">
                <div class="status-item">FPS: <span id="fps">0</span></div>
                <div class="status-item">環境亮度: <span id="brightness">0</span></div>
                <div class="status-item" id="night-mode" style="display:none; background: #ffe58f; color: #d48806;">夜間模式啟動中</div>
                <div class="status-item">一分鐘內哈欠: <span id="yawns">0</span> 次</div>
            </div>

            <div class="controls">
                <button onclick="window.forceRecalibrate()">強制重新校正</button>
                <button onclick="window.toggleLandmarks()">切換特徵點顯示</button>
                <button onclick="showNotification('即將支援匯出報表功能')">生成數據報表</button>
                <button onclick="handleButtonClick('/toggle_aspect_ratio')">切換畫面比例</button>
            </div>
        </div>

        <!-- 右邊：圖表與即時數據 -->
        <div class="right-panel">
            <div class="status-bar">
                <div class="status-item">精神分數: <span id="alertness">100</span>/100</div>
                <div class="status-item">PERCLOS: <span id="perclos">0</span>%</div>
                <div class="status-item">低頭比例: <span id="nod-ratio">0.5</span></div>
                <div class="status-item">轉頭比例: <span id="turn-ratio">0.5</span></div>
            </div>

            <canvas id="alertnessChart"></canvas>
            <canvas id="perclosChart"></canvas>
            <canvas id="nodChart"></canvas>
        </div>
    </div>

    <!-- 引入邊緣運算核心邏輯 -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>>  
</body>
</html>
